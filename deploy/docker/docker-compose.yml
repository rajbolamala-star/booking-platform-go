version: '3.9'

services:
  gateway:
    build:
      context: ../../gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SEARCH_URL=http://search:8081
      - PRICING_URL=http://pricing:8082
      - RESERVATION_URL=http://reservation:8083
      - JWT_SECRET=demo-secret-change-me
    depends_on:
      - search
      - pricing
      - reservation

  search:
    build:
      context: ../../services/search
      dockerfile: Dockerfile
    ports:
      - "8081:8081"

  pricing:
    build:
      context: ../../services/pricing
      dockerfile: Dockerfile
    ports:
      - "8082:8082"

  reservation:
    build:
      context: ../../services/reservation
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - PRICING_URL=http://pricing:8082
    depends_on:
      - pricing

  notification:
    build:
      context: ../../services/notification
      dockerfile: Dockerfile
    ports:
      - "8084:8084"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
