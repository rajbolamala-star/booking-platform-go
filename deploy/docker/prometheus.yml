global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8080']

  - job_name: 'search'
    static_configs:
      - targets: ['search:8081']

  - job_name: 'pricing'
    static_configs:
      - targets: ['pricing:8082']

  - job_name: 'reservation'
    static_configs:
      - targets: ['reservation:8083']
